<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lezione</title>
<meta name="theme-color" content="#2F3DA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lezione">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* base */
  --paper:#EEF2FB; --ink:#141A33; --ink-2:#4B5479; --primary:#2F3DA0; --on-primary:#FFFFFF;
  --rec:#CE2F3C; --ok:#0F7A4C; --warn:#8F5200; --hl:#FFE45C; --hl-ink:#1A2140;
  --line:rgba(20,26,51,.16); --soft:rgba(47,61,160,.08);
  --fs:17px;

  /* vetro: tre livelli di opacità, dal più trasparente (chrome) al più coperto (testo lungo) */
  --g-chrome:rgba(255,255,255,.58);
  --g-card:rgba(255,255,255,.72);
  --g-read:rgba(255,255,255,.86);
  --g-edge:rgba(255,255,255,.85);
  --g-edge-in:rgba(255,255,255,.55);
  --g-shadow:0 10px 30px rgba(20,26,51,.13), 0 1px 2px rgba(20,26,51,.09);
  --g-shadow-lift:0 18px 44px rgba(20,26,51,.18);
  --blur:blur(22px) saturate(175%);
  --blur-sm:blur(14px) saturate(160%);

  /* vetri colorati (sempre con testo bianco sopra) */
  --tint:rgba(47,61,160,.88); --tint-rec:rgba(206,47,60,.88);

  /* sfondo: macchie di colore che il vetro rifrange */
  --blob-a:rgba(88,120,255,.30); --blob-b:rgba(120,88,255,.22); --blob-c:rgba(0,180,190,.20);

  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A0E20; --ink:#EEF1FD; --ink-2:#A9B2D6; --primary:#A3AEFF; --on-primary:#0B1030;
    --rec:#FF6B75; --ok:#57DCA3; --warn:#F5B95A; --hl:#6A5C00; --hl-ink:#FFF6C2;
    --line:rgba(255,255,255,.16); --soft:rgba(163,174,255,.12);
    --g-chrome:rgba(26,33,62,.62);
    --g-card:rgba(28,36,68,.74);
    --g-read:rgba(24,31,60,.88);
    --g-edge:rgba(255,255,255,.20);
    --g-edge-in:rgba(255,255,255,.12);
    --g-shadow:0 12px 32px rgba(0,0,0,.50), 0 1px 2px rgba(0,0,0,.45);
    --g-shadow-lift:0 22px 50px rgba(0,0,0,.60);
    --tint:rgba(64,80,200,.86); --tint-rec:rgba(190,42,54,.86);
    --blob-a:rgba(70,100,255,.30); --blob-b:rgba(140,80,255,.22); --blob-c:rgba(0,160,180,.20);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A0E20; --ink:#EEF1FD; --ink-2:#A9B2D6; --primary:#A3AEFF; --on-primary:#0B1030;
  --rec:#FF6B75; --ok:#57DCA3; --warn:#F5B95A; --hl:#6A5C00; --hl-ink:#FFF6C2;
  --line:rgba(255,255,255,.16); --soft:rgba(163,174,255,.12);
  --g-chrome:rgba(26,33,62,.62);
  --g-card:rgba(28,36,68,.74);
  --g-read:rgba(24,31,60,.88);
  --g-edge:rgba(255,255,255,.20);
  --g-edge-in:rgba(255,255,255,.12);
  --g-shadow:0 12px 32px rgba(0,0,0,.50), 0 1px 2px rgba(0,0,0,.45);
  --g-shadow-lift:0 22px 50px rgba(0,0,0,.60);
  --tint:rgba(64,80,200,.86); --tint-rec:rgba(190,42,54,.86);
  --blob-a:rgba(70,100,255,.30); --blob-b:rgba(140,80,255,.22); --blob-c:rgba(0,160,180,.20);
  color-scheme: dark;
}

*{box-sizing:border-box}
html{font-size:var(--fs)}
body{
  margin:0; font-family:var(--body); color:var(--ink); line-height:1.55;
  background-color:var(--paper);
  background-image:
    radial-gradient(760px 620px at 12% -8%, var(--blob-a), transparent 62%),
    radial-gradient(680px 560px at 96% 6%, var(--blob-b), transparent 60%),
    radial-gradient(900px 700px at 50% 108%, var(--blob-c), transparent 62%);
  background-attachment:fixed; background-repeat:no-repeat;
  min-height:100vh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
img,svg,canvas{max-width:100%}
#main{max-width:760px;margin:0 auto;padding:12px 16px 130px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;color:var(--ink)}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.015em}
h2{font-size:1.25rem;font-weight:700;margin:26px 0 10px}
h3{font-size:1.05rem;font-weight:700}
p{margin:.4em 0}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== Ricetta del vetro =====
   .glass  = lastra traslucida con bordo chiaro e riflesso in alto.
   Le superfici che contengono testo lungo usano --g-read (86% coperto): resta leggibile. */
.glass,.panel,.item,.empty,.course-card,.file-row,.page-view,.feedback,.card-flip,
.live-text,.map-wrap,.bub.a,.sheet,.busy-card,.opt,.search,.inp,.tabbar,.player audio,
.btn,.big-action,.badge,.ref,.map-hint,.seg .ts,.progress,.meter,.md pre,.md code,.md blockquote{
  -webkit-backdrop-filter:var(--blur-sm); backdrop-filter:var(--blur-sm);
}
.panel,.item,.empty,.course-card,.file-row,.page-view,.feedback,.card-flip,
.live-text,.map-wrap,.bub.a,.sheet,.busy-card,.opt{
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
}
/* Senza supporto al blur il vetro diventa quasi opaco: mai testo su sfondo trasparente */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  :root{--g-chrome:rgba(255,255,255,.94);--g-card:rgba(255,255,255,.95);--g-read:rgba(255,255,255,.97)}
  :root[data-theme="dark"]{--g-chrome:rgba(20,26,50,.95);--g-card:rgba(20,26,50,.96);--g-read:rgba(20,26,50,.98)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--g-chrome:rgba(20,26,50,.95);--g-card:rgba(20,26,50,.96);--g-read:rgba(20,26,50,.98)}
  }
}
/* Riflesso speculare: è un livello di sfondo, non un velo sopra il testo.
   Così nessuna scritta finisce mai sotto una patina chiara. */
.panel,.item,.course-card,.opt,.big-action,.card-flip,.feedback,.sheet,.busy-card,.empty,
.btn,.inp,.search,.live-text,.map-wrap,.bub,.file-row,.tabs,.tab[aria-selected="true"]{
  background-image:linear-gradient(180deg,var(--g-edge-in) 0,transparent 46%);
}

.top{display:flex;align-items:center;gap:10px;padding:10px 0 14px}
.top h1{flex:1;min-width:0;overflow-wrap:anywhere}
.brand{position:relative}
.brand::after{content:"";position:absolute;left:-4px;right:-6px;bottom:.1em;height:.36em;background:var(--hl);z-index:-1;border-radius:4px;transform:rotate(-1deg);opacity:.9}
.icon-btn{border:1px solid transparent;background:transparent;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .15s}
.icon-btn:hover{background:var(--g-card);border-color:var(--g-edge)}

/* ===== Pulsanti ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;
  border:1px solid var(--g-edge);background:var(--tint);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;
  overflow:hidden;isolation:isolate;box-shadow:var(--g-shadow);transition:transform .12s ease, box-shadow .12s ease}
.btn::after{content:"";position:absolute;z-index:-1;left:6%;right:6%;top:1px;height:44%;border-radius:999px;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.50),rgba(255,255,255,0))}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:0 4px 12px rgba(20,26,51,.20)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--tint-rec);color:#fff}
/* varianti chiare: testo scuro su vetro molto coperto, quindi sempre leggibile */
.btn.plain{background:var(--g-read);color:var(--ink);border-color:var(--line);box-shadow:var(--g-shadow)}
.btn.ghost{background:var(--g-card);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 42%,transparent);box-shadow:none}
.btn.plain::after,.btn.ghost::after{background:linear-gradient(var(--g-edge-in),transparent)}
.tb.center,.rec-btn{isolation:isolate}
.btn.sm{min-height:36px;padding:0 13px;font-size:.9rem;border-radius:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}

/* ===== Azioni grandi ===== */
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 4px}
.big-action{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px 16px;border-radius:22px;
  border:1px solid var(--g-edge);background:var(--g-read);color:var(--ink);cursor:pointer;text-align:left;min-height:124px;
  overflow:hidden;box-shadow:var(--g-shadow);transition:transform .12s ease, box-shadow .12s ease;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.big-action:active{transform:scale(.985);box-shadow:var(--g-shadow-lift)}
.big-action .ic{width:30px;height:30px}
.big-action.rec{background:var(--tint-rec);color:#fff;border-color:rgba(255,255,255,.45)}
.big-action.rec .muted,.big-action.rec .small{color:rgba(255,255,255,.92)}
.big-action b{font-family:var(--display);font-size:1.1rem}

/* ===== Lastre di contenuto ===== */
.panel{position:relative;background:var(--g-read);border:1px solid var(--g-edge);border-radius:20px;padding:15px 17px;margin:12px 0;box-shadow:var(--g-shadow);overflow:hidden}
.list{display:flex;flex-direction:column;gap:9px}
.item{position:relative;display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--g-card);border:1px solid var(--g-edge);border-radius:16px;cursor:pointer;text-align:left;width:100%;color:var(--ink);box-shadow:var(--g-shadow);overflow:hidden;transition:transform .12s ease,box-shadow .12s ease}
.item:hover{box-shadow:var(--g-shadow-lift)}
.item:active{transform:scale(.995)}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .s{font-size:.85rem;color:var(--ink-2)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--g-edge-in)}
.badge{display:inline-block;font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--g-read);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.badge.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.empty{position:relative;padding:28px 18px;text-align:center;color:var(--ink-2);border:1px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:20px;background:var(--g-card);overflow:hidden}

.search{width:100%;min-height:50px;padding:0 16px;border-radius:16px;border:1px solid var(--g-edge);background:var(--g-read);color:var(--ink);box-shadow:var(--g-shadow)}
.search::placeholder{color:var(--ink-2)}
.hit{display:block;width:100%;text-align:left;padding:11px 13px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink)}
.hit:last-child{border-bottom:0}
.hit mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 2px}

.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.course-card{position:relative;padding:16px 14px 14px 24px;border-radius:20px;background:var(--g-read);border:1px solid var(--g-edge);cursor:pointer;text-align:left;min-height:124px;overflow:hidden;color:var(--ink);box-shadow:var(--g-shadow);transition:transform .12s ease,box-shadow .12s ease}
.course-card:active{transform:scale(.99)}
.course-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.course-card b{font-family:var(--display);font-size:1.1rem;display:block;overflow-wrap:anywhere}

.band{height:9px;border-radius:9px;background:var(--c);margin-bottom:10px;box-shadow:0 2px 14px color-mix(in srgb,var(--c) 55%,transparent)}

/* ===== Schede ===== */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:10px 0 14px;padding:5px;scrollbar-width:none;
  background:var(--g-chrome);border:1px solid var(--g-edge);border-radius:16px;box-shadow:var(--g-shadow);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:transparent;padding:8px 13px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap;border-radius:11px;transition:background .15s,color .15s}
.tab[aria-selected="true"]{color:var(--ink);background:var(--g-read);border-color:var(--g-edge);box-shadow:0 2px 8px rgba(20,26,51,.12)}

label.f{display:block;margin:14px 0 5px;font-weight:700;font-size:.92rem;color:var(--ink)}
.inp,select.inp,textarea.inp{width:100%;min-height:48px;padding:11px 13px;border-radius:14px;border:1px solid var(--g-edge);background:var(--g-read);color:var(--ink);box-shadow:inset 0 1px 0 var(--g-edge-in), 0 2px 8px rgba(20,26,51,.07)}
.inp::placeholder,textarea.inp::placeholder{color:var(--ink-2)}
.inp:focus,textarea.inp:focus,select.inp:focus{border-color:var(--primary)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.55}
.check{display:flex;gap:11px;align-items:center;margin:9px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--primary);flex:none}

/* ===== Barra in basso ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--g-chrome);border-top:1px solid var(--g-edge);
  padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;
  box-shadow:0 -8px 30px rgba(20,26,51,.14);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
.tb{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--ink-2);padding:6px 8px;cursor:pointer;min-width:58px;border-radius:12px}
.tb[aria-current="page"]{color:var(--primary);font-weight:700}
.tb.center{position:relative;width:62px;height:62px;border-radius:50%;background:var(--rec);color:#fff;margin-top:-26px;
  border:3px solid rgba(255,255,255,.55);justify-content:center;overflow:hidden;
  box-shadow:0 10px 26px rgba(206,47,60,.45), inset 0 1px 0 rgba(255,255,255,.6)}
.tb.center::after{content:"";position:absolute;z-index:-1;left:14%;right:14%;top:6%;height:38%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.tb.center:active{transform:scale(.96)}
.tb.center .ic{width:28px;height:28px}

/* ===== Overlay ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(8,12,30,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:var(--g-read);border:1px solid var(--g-edge);border-bottom:0;
  box-shadow:0 -14px 48px rgba(8,12,30,.30);width:100%;max-width:560px;max-height:90vh;overflow:auto;
  border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));color:var(--ink)}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:26px;border-bottom:1px solid var(--g-edge)}}
.busy{position:fixed;inset:0;z-index:60;background:rgba(8,12,30,.50);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
.busy-card{position:relative;background:var(--g-read);border:1px solid var(--g-edge);border-radius:26px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:var(--g-shadow-lift);color:var(--ink);overflow:hidden}
.spinner{width:42px;height:42px;margin:0 auto 12px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:70;
  background:color-mix(in srgb,var(--ink) 92%,transparent);color:var(--paper);
  padding:13px 17px;border-radius:16px;max-width:min(92vw,480px);border:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 30px rgba(0,0,0,.28)}

/* ===== Registrazione ===== */
.rec-stage{display:flex;flex-direction:column;align-items:center;gap:15px;padding:12px 0}
.timer{font-family:var(--display);font-size:3.4rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.rec-btn{position:relative;width:132px;height:132px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:var(--rec);color:#fff;display:grid;place-items:center;cursor:pointer;overflow:hidden;
  box-shadow:0 16px 38px rgba(206,47,60,.42), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -12px 26px rgba(0,0,0,.20)}
.rec-btn::after{content:"";position:absolute;z-index:-1;left:12%;right:12%;top:5%;height:40%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.rec-btn .ic{width:48px;height:48px}
.rec-btn.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--rec) 22%,transparent)}}
.meter{width:100%;max-width:360px;height:11px;border-radius:11px;background:var(--g-card);border:1px solid var(--g-edge);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 55%,#fff));transition:width .1s}
.live-text{width:100%;max-height:36vh;overflow:auto;background:var(--g-read);border:1px solid var(--g-edge);border-radius:18px;padding:14px 16px;color:var(--ink);box-shadow:var(--g-shadow)}
.live-text .interim{color:var(--ink-2);font-style:italic}

/* ===== Trascrizione ===== */
.seg{display:grid;grid-template-columns:auto 1fr;gap:5px 11px;padding:10px 6px;border-bottom:1px solid var(--line)}
.seg .ts{border:1px solid var(--g-edge);background:var(--g-card);border-radius:10px;padding:3px 9px;font-variant-numeric:tabular-nums;cursor:pointer;height:fit-content;font-size:.85rem;color:var(--ink)}
.seg .sp{border:0;background:transparent;color:var(--primary);font-weight:700;font-size:.8rem;cursor:pointer;padding:0;justify-self:start}
.seg .tx{grid-column:2}
.seg .tx[contenteditable="true"]{background:var(--g-read);border:1.5px dashed var(--primary);border-radius:10px;padding:5px 9px}
.seg.active{background:color-mix(in srgb,var(--hl) 40%,transparent);border-radius:10px}
.low{text-decoration:underline wavy var(--warn);text-underline-offset:3px}
.player{position:fixed;left:0;right:0;bottom:80px;z-index:15;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.player audio{width:100%;max-width:720px;pointer-events:auto;border-radius:30px;box-shadow:0 8px 26px rgba(20,26,51,.24)}

/* ===== Markdown ===== */
.md{overflow-wrap:anywhere;color:var(--ink)}
.md h2{font-size:1.2rem;margin-top:24px}
.md h3{margin-top:18px}
.md ul,.md ol{padding-left:1.35em}
.md li{margin:.28em 0}
.md blockquote{margin:14px 0;padding:12px 16px;border-left:5px solid var(--line);background:var(--g-card);border:1px solid var(--g-edge);border-left-width:5px;border-radius:0 14px 14px 0}
.md blockquote.def{border-left-color:var(--primary)}
.md blockquote.def strong:first-child{background:var(--hl);color:var(--hl-ink);padding:0 5px;border-radius:4px}
.md blockquote.ex{border-left-color:var(--ok)}
.md blockquote.warn{border-left-color:var(--warn)}
.md mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 3px}
.md code{background:var(--g-card);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
.md pre{overflow-x:auto;background:var(--g-read);border:1px solid var(--g-edge);padding:12px;border-radius:14px}
.md pre code{background:transparent;border:0;padding:0}
.md table{border-collapse:collapse}
.md .tablewrap,.tablewrap{overflow-x:auto;max-width:100%}
.md math[display="block"]{display:block;overflow-x:auto;margin:10px 0}
.ref{border:1px solid var(--g-edge);background:var(--g-read);border-radius:99px;padding:1px 10px;font-size:.78rem;cursor:pointer;margin:0 3px;vertical-align:middle;color:var(--ink)}

/* ===== Schema ad albero ===== */
.outline details{margin-left:14px;border-left:2px solid var(--line);padding-left:12px}
.outline>details{margin-left:0}
.outline summary{cursor:pointer;padding:6px 0;font-weight:700;color:var(--ink)}
.outline .leaf{margin-left:14px;padding:5px 0 5px 12px;border-left:2px solid var(--line)}

/* ===== Mappa ===== */
.map-wrap{position:relative;height:62vh;min-height:380px;border:1px solid var(--g-edge);border-radius:22px;background:var(--g-read);overflow:hidden;touch-action:none;box-shadow:var(--g-shadow)}
.map-wrap svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.map-tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.map-hint{position:absolute;left:12px;bottom:10px;font-size:.8rem;color:var(--ink-2);background:var(--g-read);border:1px solid var(--g-edge);padding:4px 10px;border-radius:10px}

/* ===== Tabelle ===== */
table.data{border-collapse:separate;border-spacing:0;min-width:100%;background:var(--g-read);border-radius:14px;overflow:hidden}
table.data th,table.data td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;color:var(--ink)}
table.data th:last-child,table.data td:last-child{border-right:0}
table.data tr:last-child td{border-bottom:0}
table.data th{background:var(--soft);font-family:var(--display);font-weight:700}
table.data td:focus{outline:2px solid var(--primary);outline-offset:-2px}

/* ===== Quiz ===== */
.progress{height:9px;background:var(--g-card);border:1px solid var(--g-edge);border-radius:9px;overflow:hidden;margin:8px 0 18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),color-mix(in srgb,var(--primary) 55%,#fff))}
.q{font-family:var(--display);font-size:1.3rem;font-weight:700;margin:8px 0 16px;color:var(--ink)}
.opt{position:relative;display:block;width:100%;text-align:left;padding:15px 16px;margin:9px 0;border-radius:18px;border:1px solid var(--g-edge);background:var(--g-read);color:var(--ink);cursor:pointer;box-shadow:var(--g-shadow);overflow:hidden;transition:transform .1s ease,box-shadow .12s ease}
.opt:hover:not(:disabled){box-shadow:var(--g-shadow-lift)}
.opt:active{transform:scale(.995)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--g-read))}
.opt.wrong{border-color:var(--rec);background:color-mix(in srgb,var(--rec) 18%,var(--g-read))}
.opt:disabled{opacity:1}
.feedback{position:relative;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--g-read);border:1px solid var(--g-edge);box-shadow:var(--g-shadow);overflow:hidden;color:var(--ink)}
.score{font-family:var(--display);font-size:4rem;font-weight:800;line-height:1;color:var(--ink)}

/* ===== Flashcard ===== */
.card-flip{position:relative;min-height:240px;display:grid;place-items:center;text-align:center;padding:26px;border-radius:26px;background:var(--g-read);border:1px solid var(--g-edge);cursor:pointer;font-size:1.2rem;color:var(--ink);box-shadow:var(--g-shadow-lift);overflow:hidden}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.grades .btn{padding:0 8px;font-size:.88rem}

/* ===== Chat ===== */
.chat{display:flex;flex-direction:column;gap:11px;margin-bottom:14px}
.bub{padding:11px 15px;border-radius:18px;max-width:88%}
.bub.u{align-self:flex-end;background:var(--tint);color:#fff;border:1px solid var(--g-edge);border-bottom-right-radius:5px;box-shadow:var(--g-shadow)}
.bub.a{align-self:flex-start;background:var(--g-read);color:var(--ink);border:1px solid var(--g-edge);border-bottom-left-radius:5px;box-shadow:var(--g-shadow)}
.composer{display:flex;gap:9px;position:sticky;bottom:90px}

/* ===== File e pagine ===== */
.file-row{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--g-edge);border-radius:16px;background:var(--g-card);margin:9px 0;color:var(--ink);box-shadow:var(--g-shadow)}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--soft);border:1px solid var(--g-edge);flex:none;display:grid;place-items:center}
.page-view{border:1px solid var(--g-edge);border-radius:16px;overflow:hidden;background:var(--g-card);margin:12px 0}
.page-view img,.page-view canvas{display:block;width:100%;height:auto}

/* ===== Onboarding ===== */
.onb{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:15px}
.onb .big{font-family:var(--display);font-size:2.3rem;font-weight:800;line-height:1.05;color:var(--ink)}
.steps{display:flex;gap:6px}
.steps i{height:6px;flex:1;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--primary)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}


/* ===== Nota "perché la tua risposta non va" ===== */
.why-wrong{margin:10px 0;padding:10px 13px;border-radius:12px;color:var(--ink);
  background:color-mix(in srgb,var(--rec) 10%,var(--g-read));border:1px solid color-mix(in srgb,var(--rec) 35%,transparent);
  border-left:4px solid var(--rec)}
.why-wrong b{color:var(--rec)}

/* ===== Pulsanti rossi di registrazione in vetro =====
   Rosso traslucido + blur: lo sfondo si intravede, ma il rosso resta abbastanza
   pieno da tenere bianche e leggibili icone e scritte (contrasto > 4.5:1). */
:root{--rec-glass:rgba(196,34,48,.80);--rec-glass-text:rgba(176,28,42,.88);--rec-glow:rgba(206,47,60,.42)}
:root[data-theme="dark"]{--rec-glass:rgba(214,52,66,.72);--rec-glass-text:rgba(190,40,54,.84);--rec-glow:rgba(255,90,100,.30)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rec-glass:rgba(214,52,66,.72);--rec-glass-text:rgba(190,40,54,.84);--rec-glow:rgba(255,90,100,.30)}}

.tb.center,.rec-btn,.big-action.rec{
  -webkit-backdrop-filter:blur(18px) saturate(190%);backdrop-filter:blur(18px) saturate(190%);
  border:1px solid rgba(255,255,255,.55);color:#fff;
  text-shadow:0 1px 2px rgba(80,0,10,.30);
}
/* riflesso in alto e bagliore interno in basso: livelli di sfondo, mai sopra il contenuto */
.tb.center,.rec-btn{
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%),
    radial-gradient(90% 50% at 50% 110%,rgba(255,170,175,.45),rgba(255,170,175,0) 70%),
    var(--rec-glass);
  box-shadow:0 12px 30px var(--rec-glow), inset 0 1px 0 rgba(255,255,255,.75), inset 0 -8px 18px rgba(90,0,12,.22), 0 0 0 1px rgba(255,255,255,.12);
}
.tb.center::after,.rec-btn::after{display:none}
.tb.center{border-width:1.5px}
.tb.center:hover,.rec-btn:hover{box-shadow:0 16px 36px var(--rec-glow), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -8px 18px rgba(90,0,12,.22)}
.tb.center .ic,.rec-btn .ic{filter:drop-shadow(0 1px 1px rgba(80,0,10,.35))}

.big-action.rec{
  background:
    linear-gradient(180deg,rgba(255,255,255,.24) 0,rgba(255,255,255,0) 44%),
    radial-gradient(80% 60% at 100% 100%,rgba(255,160,165,.30),rgba(255,160,165,0) 70%),
    var(--rec-glass-text);
  box-shadow:0 14px 34px var(--rec-glow), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -10px 22px rgba(90,0,12,.20);
}
.big-action.rec b{color:#fff}
.big-action.rec .muted,.big-action.rec .small{color:#fff;opacity:.95}

/* senza blur: rosso pieno, stesso contrasto */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  :root{--rec-glass:#C42230;--rec-glass-text:#B01C2A}
}
</style>

/* ============ Archivio locale (IndexedDB) ============ */
const DB = (() => {
  const stores = ['courses', 'sources', 'blobs', 'materials', 'cards'];
  const mem = {}; let dbp;

    if (dbp) return dbp;

    const db = await open();
    if (!db) return fallback(mm(store));
    try { return await wrap(fn(db.transaction(store, mode).objectStore(store))); }
    catch (e) { console.warn('IDB', e); return fallback(mm(store)); }
  }
  return {
    get: (s, id) => run(s, 'readonly', st => st.get(id), m => m.get(id)),
    all: (s) => run(s, 'readonly', st => st.getAll(), m => [...m.values()]).then(x => x || []),
    put: (s, o) => run(s, 'readwrite', st => st.put(o), m => { m.set(o.id, o); }),
    del: (s, id) => run(s, 'readwrite', st => st.delete(id), m => { m.delete(id); }),

  };

/* ============ Overlay: fogli e domande ============ */
function sheet(content, { onClose } = {}) {
  const bg = h('div', { class: 'sheet-bg' });
  const sh = h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' }, content);
  const close = () => { bg.remove(); document.removeEventListener('keydown', key); onClose && onClose(); };
  const key = e => { if (e.key === 'Escape') close(); };
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.addEventListener('keydown', key);
  bg.append(sh); document.body.append(bg);
  setTimeout(() => { const f = sh.querySelector('input,select,textarea,button'); f && f.focus(); }, 30);
  return close;
}
function ask({ title, text, fields = [], ok = 'Conferma', danger = false }) {
  return new Promise(res => {
    const inputs = {};
    const body = h('div', null, h('h2', { style: 'margin-top:0' }, title), text ? h('p', { class: 'muted' }, text) : null,
      fields.map(f => {
        let el;
        if (f.type === 'select') el = h('select', { class: 'inp' }, f.options.map(o => h('option', { value: o[0], selected: o[0] === f.value }, o[1])));
        else if (f.type === 'textarea') el = h('textarea', { class: 'inp', placeholder: f.placeholder || '' }, f.value || '');
        else if (f.type === 'checkbox') { el = h('input', { type: 'checkbox', checked: f.value }); inputs[f.name] = el; return h('label', { class: 'check' }, el, f.label); }
        else el = h('input', { class: 'inp', type: f.type || 'text', value: f.value ?? '', placeholder: f.placeholder || '', min: f.min, max: f.max });
        inputs[f.name] = el;
        return [h('label', { class: 'f' }, f.label, el)];
      }),
      h('div', { class: 'row end', style: 'margin-top:18px' },
        h('button', { class: 'btn plain', onclick: () => { done = true; close(); res(null); } }, 'Annulla'),
        h('button', { class: 'btn' + (danger ? ' danger' : ''), onclick: () => { const v = {}; for (const k in inputs) v[k] = inputs[k].type === 'checkbox' ? inputs[k].checked : inputs[k].value; done = true; close(); res(v); } }, ok)));
    let done = false;
    const close = sheet(body, { onClose: () => { if (!done) res(null); } });
  });
}

/* ============ Markdown, formule, riferimenti ============ */
function renderMd(md, refMap) {
  const math = [];
  let src = String(md || '')
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, x) => { math.push([x, true]); return `@@M${math.length - 1}@@`; })
    .replace(/(^|[^\\$\d])\$([^\n$]+?)\$/g, (m, p, x) => { math.push([x, false]); return p + `@@M${math.length - 1}@@`; })
    .replace(/\[\[(S\d+)\s+([^\]]+?)\]\]/g, (m, s, loc) => `@@R${s}~${loc.trim().replace(/\s+/g, '')}@@`);
  src = src.replace(/==([^=\n]+)==/g, '<mark>$1</mark>');
  let html = window.marked ? marked.parse(src) : esc(src).replace(/\n/g, '<br>');
  if (window.DOMPurify) html = DOMPurify.sanitize(html);
  html = html.replace(/@@M(\d+)@@/g, (m, i) => {
    const [x, d] = math[+i];
    try { return window.katex ? katex.renderToString(x, { displayMode: d, output: 'mathml', throwOnError: false }) : `<code>${esc(x)}</code>`; }
    catch (e) { return `<code>${esc(x)}</code>`; }
  });
  html = html.replace(/@@R(S\d+)~([^@]+)@@/g, (m, s, loc) => `<button class="ref" data-s="${s}" data-loc="${esc(loc)}">${/^p/i.test(loc) ? '📄' : '🎙️'} ${esc(loc)}</button>`);
  const div = h('div', { class: 'md', html });
  div.querySelectorAll('table').forEach(t => { const w = h('div', { class: 'tablewrap' }); t.replaceWith(w); t.classList.add('data'); w.append(t); });
  div.querySelectorAll('blockquote').forEach(b => {
    const t = b.textContent;
    if (/Definizione/i.test(t)) b.classList.add('def'); else if (/Esempio|💡/i.test(t)) b.classList.add('ex'); else if (/Discrepanza|⚠️/.test(t)) b.classList.add('warn');
  });
  div.querySelectorAll('button.ref').forEach(b => b.addEventListener('click', () => openRef(refMap, b.dataset.s, b.dataset.loc)));
  return div;
}
function refButton(refMap, ref) {
  const m = String(ref || '').match(/(S\d+)\s*(.+)/); if (!m) return null;
  const loc = m[2].replace(/\s+/g, '');
  return h('button', { class: 'ref', onclick: e => { e.stopPropagation(); openRef(refMap, m[1], loc); } }, (/^p/i.test(loc) ? '📄 ' : '🎙️ ') + loc);
}
let currentSourceCtx = null;
function openRef(refMap, label, loc) {
  const id = refMap && refMap[label];
  if (!id) return toast('Fonte non trovata.');
  if (/^p/i.test(loc)) {
    const n = parseInt(loc.replace(/\D/g, ''), 10) || 1;
    if (currentSourceCtx && currentSourceCtx.id === id && currentSourceCtx.showPage) return currentSourceCtx.showPage(n);
    return nav.go('source', { id, tab: 'pages', page: n });
  }
  const t = parseTime(loc);
  if (currentSourceCtx && currentSourceCtx.id === id && currentSourceCtx.seek) return currentSourceCtx.seek(t);
  nav.go('source', { id, tab: 'transcript', seek: t });
}

const Views = {};

let recordingActive = false;
const nav = {
  stack: [],
  go(view, params = {}) { this.stack.push({ view, params }); render(); },
  replace(view, params = {}) { this.stack.pop(); this.stack.push({ view, params }); render(); },
  back() { if (this.stack.length > 1) { this.stack.pop(); render(); } else this.root('home'); },
  root(view, params = {}) { this.stack = [{ view, params }]; render(); }
};
async function guardLeave() {
  if (!recordingActive) return true;
  const r = await ask({ title: 'Registrazione in corso', text: 'Se esci ora la registrazione viene fermata e salvata.', ok: 'Ferma e salva' });
  if (!r) return false;
  if (window.__stopRecording) await window.__stopRecording();
  return true;
}
async function render() {
  const fns = cleanups; cleanups = [];
  fns.forEach(f => { try { f(); } catch (e) { } });
  currentSourceCtx = null;
  const { view, params } = nav.stack[nav.stack.length - 1];

  renderTabbar(view);
  try { await Views[view](main, params || {}); }
  catch (e) { console.error(e); main.append(h('div', { class: 'empty' }, 'Non riesco a caricare questa schermata.', h('br'), h('button', { class: 'btn sm', style: 'margin-top:10px', onclick: () => nav.root('home') }, 'Torna alla home'))); }
}

async function getCourses() { return (await DB.all('courses')).sort((a, b) => a.name.localeCompare(b.name)); }

  return h('select', { class: 'inp' }, cs.map(c => h('option', { value: c.id, selected: c.id === value }, c.name)));

function sourceText(s, label) {
  if (s.kind === 'lecture') {
    const lines = (s.segments || []).map(g => `[[${label} ${fmt(g.t)}]]${g.speaker && g.speaker !== 'Professore' ? ' (' + g.speaker + ')' : ''} ${g.text}`);
    for (const b of s.bookmarks || []) lines.push(`[[${label} ${fmt(b.t)}]] ★ SEGNALIBRO DELLO STUDENTE: ${b.note || 'momento importante'}`);
    return lines.join('\n');
  }
  return (s.pages || []).map(p => `[[${label} p.${p.n}]]\n${p.text}`).join('\n\n');
}
function sourceKind(s) { return s.kind === 'lecture' ? 'registrazione' : 'documento'; }
async function buildContext(sources, budget = 42000) {
  const refMap = {}; const parts = []; let truncated = false;
  const share = Math.floor(budget / Math.max(1, sources.length));
  sources.forEach((s, i) => {
    const label = 'S' + (i + 1); refMap[label] = s.id;
    let txt = sourceText(s, label);
    if (txt.length > share && s.study && s.study.md) {
      txt = relabel(s.study.md, s.study.refMap, { [s.id]: label });
    }
    if (txt.length > share) { txt = txt.slice(0, share) + '\n[…testo troncato…]'; truncated = true; }
    parts.push(`=== FONTE ${label}: ${sourceKind(s)} "${s.title}" ===\n${txt}`);
  });
  if (truncated) toast('Alcune fonti sono lunghe: genera prima gli appunti per risultati più completi.', 5000);
  return { text: parts.join('\n\n'), refMap };
}
function relabel(md, oldMap, idToLabel) {
  return String(md).replace(/\[\[(S\d+)\s+([^\]]+?)\]\]/g, (m, l, loc) => { const id = oldMap && oldMap[l]; const nl = id && idToLabel[id]; return nl ? `[[${nl} ${loc}]]` : ''; });
}
async function glossaryOf(courseId) { const c = await DB.get('courses', courseId); return c && c.glossary ? c.glossary : ''; }
async function download(filename, data) {
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/.test(filename) ? 'application/json' : /\.svg$/.test(filename) ? 'image/svg+xml' : 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename, style: 'display:none' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { toast('Salvataggio non riuscito.'); }
}

function chatView(body, course, srcs) {
  if (!srcs.length) { body.append(h('div', { class: 'empty' }, 'Aggiungi lezioni o documenti per fare domande sul corso.')); return; }
  const turns = [];
  const log = h('div', { class: 'chat' }, h('div', { class: 'bub a' }, `Chiedimi qualcosa su ${course.name}. Rispondo solo in base alle tue lezioni e ai tuoi documenti, citando dove se ne parla.`));
  const box = h('input', { class: 'inp grow', placeholder: 'Es. Cos\'è l\'umorismo per Pirandello?' });
  let ctx = null; let ctl = null;
  const send = async () => {
    const q = box.value.trim(); if (!q) return;
    box.value = '';
    if (!ctx) ctx = await buildContext(srcs, 40000);
    log.append(h('div', { class: 'bub u' }, q));
    const out = h('div', { class: 'bub a' }, 'Sto cercando nelle lezioni…'); log.append(out);
    turns.push({ role: 'user', content: q });
    while (turns.length > 8) turns.splice(0, 2);
    const rules = `Sei un tutor universitario. Rispondi in italiano SOLO usando le fonti qui sotto. Dopo ogni affermazione cita la fonte con [[S1 12:30]] o [[S2 p.7]] esattamente in questo formato. Se la risposta non è nelle fonti, dillo chiaramente e non inventare. Usa Markdown breve.\n\nFONTI:\n${ctx.text}`;
    ctl = new AbortController();
    try {
      const { text } = await ai([{ role: 'user', content: rules }, ...turns], { cache: false, signal: ctl.signal, onText: ({ text }) => { out.innerHTML = ''; out.append(renderMd(text, ctx.refMap)); } });
      turns.push({ role: 'assistant', content: text });
      out.innerHTML = ''; out.append(renderMd(text, ctx.refMap));
    } catch (e) { turns.pop(); out.textContent = (e.text ? e.text + '\n\n' : '') + errCopy(e); }
  };
  box.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  body.append(log, h('div', { class: 'composer' }, box, h('button', { class: 'btn', 'aria-label': 'Invia', onclick: send }, icon('send'))));
  cleanups.push(() => ctl && ctl.abort());
}

function searchAll(qs, sources, cmap, out) {
  out.innerHTML = '';
  const q = qs.trim().toLowerCase(); if (q.length < 2) return;
  const hits = [];
  for (const s of sources) {
    for (const g of s.segments || []) if (g.text.toLowerCase().includes(q)) hits.push({ s, text: g.text, params: { id: s.id, tab: 'transcript', seek: g.t }, where: fmt(g.t) });
    for (const p of s.pages || []) { const i = p.text.toLowerCase().indexOf(q); if (i >= 0) hits.push({ s, text: p.text.slice(Math.max(0, i - 60), i + 90), params: { id: s.id, tab: 'pages', page: p.n }, where: 'p. ' + p.n }); }
    if (s.study && s.study.md.toLowerCase().includes(q)) { const i = s.study.md.toLowerCase().indexOf(q); hits.push({ s, text: s.study.md.slice(Math.max(0, i - 60), i + 90), params: { id: s.id, tab: 'text' }, where: 'appunti' }); }
    if (hits.length > 40) break;
  }
  if (!hits.length) { out.append(h('p', { class: 'muted small', style: 'padding:8px 4px' }, 'Nessun risultato.')); return; }
  const box = h('div', { class: 'panel', style: 'padding:4px 0' });
  for (const x of hits.slice(0, 30)) {
    const i = x.text.toLowerCase().indexOf(q);
    const snip = h('span', null, x.text.slice(Math.max(0, i - 50), i), h('mark', null, x.text.slice(i, i + q.length)), x.text.slice(i + q.length, i + q.length + 70));
    box.append(h('button', { class: 'hit', onclick: () => nav.go('source', x.params) }, h('div', { class: 'small muted' }, `${x.s.title}, ${x.where}${cmap[x.s.courseId] ? ', ' + cmap[x.s.courseId].name : ''}`), snip));
  }
  out.append(box);
}

function parsePasted(text) {
  const segs = [];
  for (const raw of text.split(/\n+/)) {

    const mt = line.match(/^\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*[-–:]?\s*(.*)$/);
    if (mt) segs.push({ t: parseTime(mt[1]), text: mt[2], speaker: 'Professore', conf: null });
    else segs.push({ t: segs.length ? segs[segs.length - 1].t : 0, text: line, speaker: 'Professore', conf: null });
  }
  return segs;
}

/* ============ Immagini e PDF ============ */
async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { } }
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file); });
}
async function compressImage(file, maxSide = 1600, enhance = false) {
  const bmp = await loadBitmap(file);
  const w = bmp.width, hgt = bmp.height, k = Math.min(1, maxSide / Math.max(w, hgt));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(hgt * k);
  const ctx = c.getContext('2d'); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  if (enhance) enhanceCanvas(c);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.85));
}
function enhanceCanvas(c) {
  const ctx = c.getContext('2d'); const d = ctx.getImageData(0, 0, c.width, c.height); const a = d.data;
  const hist = new Uint32Array(256);
  for (let i = 0; i < a.length; i += 4) { const g = (a[i] * 0.3 + a[i + 1] * 0.59 + a[i + 2] * 0.11) | 0; a[i] = g; hist[g]++; }
  const n = a.length / 4; let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > n * 0.02) { lo = i; break; } }
  acc = 0; for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > n * 0.02) { hi = i; break; } }
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < a.length; i += 4) { const v = Math.max(0, Math.min(255, (a[i] - lo) * 255 / span)); a[i] = a[i + 1] = a[i + 2] = v; }
  ctx.putImageData(d, 0, 0);
}
async function checkQuality(blob) {
  try {
    const bmp = await loadBitmap(blob); const S = 160;
    const c = document.createElement('canvas'); c.width = S; c.height = S; const ctx = c.getContext('2d'); ctx.drawImage(bmp, 0, 0, S, S);
    const a = ctx.getImageData(0, 0, S, S).data; const g = new Float32Array(S * S); let sum = 0;
    for (let i = 0; i < S * S; i++) { g[i] = a[i * 4] * 0.3 + a[i * 4 + 1] * 0.59 + a[i * 4 + 2] * 0.11; sum += g[i]; }
    const mean = sum / (S * S);
    let lm = 0, lv = 0, cnt = 0;
    for (let y = 1; y < S - 1; y++) for (let x = 1; x < S - 1; x++) { const i = y * S + x; const L = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - S] - g[i + S]; lm += L; lv += L * L; cnt++; }
    const variance = lv / cnt - (lm / cnt) ** 2;
    if (mean < 55) return 'troppo scura';
    if (variance < 40) return 'forse sfocata';
    return null;
  } catch (e) { return null; }
}
function pdfReady() {
  if (!window.pdfjsLib) return false;
  try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) { }
  return true;
}
async function openPdf(data) {
  if (!pdfReady()) throw { userMsg: 'Il lettore PDF non si è caricato. Ricarica la pagina.' };
  const task = pdfjsLib.getDocument({ data: data.slice(0), isEvalSupported: false });
  task.onPassword = async (update, reason) => {
    const r = await ask({ title: 'PDF protetto', text: reason === 2 ? 'Password errata, riprova.' : 'Inserisci la password del PDF.', fields: [{ name: 'pw', label: 'Password', type: 'password' }], ok: 'Apri' });
    if (r) update(r.pw); else task.destroy();
  };
  try { return await task.promise; }
  catch (e) { throw { userMsg: e && e.name === 'PasswordException' ? 'PDF protetto: password non inserita.' : 'Il PDF sembra danneggiato o non leggibile.' }; }
}
async function renderPdfPage(pdf, n, maxSide = 1600) {
  const page = await pdf.getPage(n);
  const vp1 = page.getViewport({ scale: 1 });
  const scale = Math.min(3, maxSide / Math.max(vp1.width, vp1.height));
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return c;
}
async function ocrBatch(blobs, signal) {
  const n = blobs.length;
  const prompt = `Ricevi ${n} immagini in ordine: pagine di materiale universitario (slide, libri, dispense, appunti scritti a mano o foto della lavagna). Trascrivi FEDELMENTE il testo di ciascuna.
Regole: mantieni titoli (con #), elenchi (con -) e tabelle (in Markdown); scrivi le formule in LaTeX tra $...$; descrivi brevemente grafici o diagrammi tra [Figura: ...]; se una parte è illeggibile scrivi [testo non leggibile]; non aggiungere nulla che non sia nell'immagine; non correggere il contenuto.
Rispondi solo con JSON: {"pages":[{"text":"...","confidence":0.9}]} con esattamente ${n} elementi nello stesso ordine. confidence è tra 0 e 1 (bassa se la scrittura è difficile).`;
  const d = await aiJson(prompt, { images: blobs, signal, modelTier: 'default' }, x => x && Array.isArray(x.pages) && x.pages.length === n);
  return d.pages.map(p => ({ text: String(p.text || ''), conf: typeof p.confidence === 'number' ? p.confidence : null }));
}

  const linkSel = h('select', { class: 'inp' });

    const ls = (await DB.all('sources')).filter(s => s.courseId === sel.value && s.kind === 'lecture').sort((a, b) => b.createdAt - a.createdAt);

  const items = [];
  const list = h('div');
  const camIn = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'sr' });

    h('button', { class: 'btn plain', onclick: () => camIn.click() }, icon('camera'), 'Scatta foto'),
    h('button', { class: 'btn plain', onclick: () => fileIn.click() }, icon('upload'), 'Scegli file'), camIn, fileIn),
    h('p', { class: 'small muted' }, 'PDF, JPEG, PNG, HEIC. Fino a 300 pagine per PDF. Puoi scattare più foto una dopo l\'altra.'), list);
  const go = h('button', { class: 'btn grow', disabled: true }, icon('spark'), 'Leggi e salva');
  m.append(h('div', { class: 'row', style: 'margin-top:14px' }, go));

  const draw = () => {
    list.innerHTML = '';
    items.forEach((it, i) => {
      const thumb = it.url ? h('img', { class: 'thumb', src: it.url, alt: '' }) : h('span', { class: 'thumb' }, icon('doc'));
      const range = it.kind === 'pdf' ? h('div', { class: 'row small', style: 'margin-top:4px' }, 'Pagine',
        h('input', { class: 'inp', style: 'width:76px;min-height:34px;padding:4px 8px', type: 'number', min: 1, max: it.pages, value: it.from, onchange: e => { it.from = Math.max(1, Math.min(it.pages, +e.target.value || 1)); } }),
        'a', h('input', { class: 'inp', style: 'width:76px;min-height:34px;padding:4px 8px', type: 'number', min: 1, max: it.pages, value: it.to, onchange: e => { it.to = Math.max(1, Math.min(it.pages, +e.target.value || 1)); } }),
        `di ${it.pages}`) : null;
      list.append(h('div', { class: 'file-row' }, thumb,
        h('div', { class: 'grow', style: 'min-width:0' }, h('div', { class: 't', style: 'overflow-wrap:anywhere' }, it.name), it.warn ? h('div', { class: 'small', style: 'color:var(--warn)' }, `Foto ${it.warn}: valuta di rifarla.`) : null, range),
        h('button', { class: 'icon-btn', 'aria-label': 'Sposta su', disabled: i === 0, onclick: () => { [items[i - 1], items[i]] = [items[i], items[i - 1]]; draw(); } }, icon('up')),
        h('button', { class: 'icon-btn', 'aria-label': 'Sposta giù', disabled: i === items.length - 1, onclick: () => { [items[i + 1], items[i]] = [items[i], items[i + 1]]; draw(); } }, icon('down')),
        h('button', { class: 'icon-btn', 'aria-label': 'Rimuovi', onclick: () => { items.splice(i, 1); draw(); } }, icon('trash'))));
    });

  };
  const addFiles = async files => {
    for (const f of files) {
      const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
      if (isPdf) {
        try {
          const buf = await f.arrayBuffer();
          const pdf = await openPdf(buf);
          if (!title.value) title.value = f.name.replace(/\.pdf$/i, '');
          items.push({ kind: 'pdf', name: f.name, file: f, buf, pdf, pages: pdf.numPages, from: 1, to: Math.min(pdf.numPages, 300) });
          if (pdf.numPages > 300) toast('PDF oltre 300 pagine: scegli l\'intervallo da usare.');
        } catch (e) { toast(errCopy(e)); }
      } else {
        try {
          const blob = await compressImage(f, 1600, enhance.checked);
          if (blob.size > 12 * 1024 * 1024) { toast('Immagine troppo grande.'); continue; }
          const warn = await checkQuality(blob);
          items.push({ kind: 'img', name: f.name || 'Foto', blob, url: URL.createObjectURL(blob), warn });
        } catch (e) { toast(`Non riesco a leggere "${f.name}". Se è HEIC, convertila in JPEG.`); }
      }
    }
    draw();
  };
  camIn.addEventListener('change', () => { const fs = [...camIn.files]; camIn.value = ''; addFiles(fs); });
  fileIn.addEventListener('change', () => { const fs = [...fileIn.files]; fileIn.value = ''; addFiles(fs); });
  enhance.addEventListener('change', () => LS.set('enhance', enhance.checked));
  go.addEventListener('click', async () => {
    const doc = { id: uid(), kind: 'doc', courseId: sel.value, lectureId: linkSel.value || null, title: title.value.trim() || items[0].name, createdAt: Date.now(), files: [], pages: [] };
    const res = await withBusy('Preparo le pagine…', async (signal, setLabel) => {
      const limits = await (await getSample())?.limits?.().catch(() => null);
      const maxImgs = limits && limits.images ? Math.max(1, Math.min(limits.images.maxCount, 5)) : 0;
      const queue = [];
      let pageNo = 0;
      for (let fi = 0; fi < items.length; fi++) {
        const it = items[fi];
        if (it.kind === 'img') {
          const imageId = uid(); await DB.put('blobs', { id: imageId, blob: it.blob });
          doc.files.push({ name: it.name, type: 'image', blobId: imageId });
          const pg = { n: ++pageNo, text: '', conf: null, fileIdx: doc.files.length - 1, imageId };
          doc.pages.push(pg); queue.push({ pg, blob: it.blob });
        } else {
          const blobId = uid(); await DB.put('blobs', { id: blobId, blob: it.file });
          doc.files.push({ name: it.name, type: 'pdf', blobId, pageCount: it.pages });
          const from = Math.min(it.from, it.to), to = Math.max(it.from, it.to);
          for (let n = from; n <= to; n++) {
            if (signal.aborted) throw { code: 'cancelled' };
            setLabel(`Leggo ${it.name}: pagina ${n} di ${to}`);
            const page = await it.pdf.getPage(n);
            const tc = await page.getTextContent();
            const text = tc.items.map(x => (x.str || '') + (x.hasEOL ? '\n' : ' ')).join('').replace(/[ \t]+/g, ' ').trim();
            const pg = { n: ++pageNo, text, conf: 1, fileIdx: doc.files.length - 1, filePage: n };
            doc.pages.push(pg);
            if (text.length < 40) {
              const c = await renderPdfPage(it.pdf, n);
              const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
              queue.push({ pg, blob });
            }
          }
        }
      }
      if (queue.length) {
        if (!maxImgs) throw { code: 'images_unavailable' };
        for (let i = 0; i < queue.length; i += maxImgs) {
          const batch = queue.slice(i, i + maxImgs);
          setLabel(`Riconosco il testo: pagine ${i + 1}–${i + batch.length} di ${queue.length}`);
          const out = await ocrBatch(batch.map(b => b.blob), signal);
          out.forEach((o, k) => { batch[k].pg.text = o.text; batch[k].pg.conf = o.conf; });
        }
      }
      await DB.put('sources', doc);
      return doc;
    });
    if (res) { toast('Documento salvato.'); nav.replace('source', { id: res.id, tab: 'pages' }); }
    else if (doc.pages.some(p => p.text)) {
      const r = await ask({ title: 'Salvare le pagine lette finora?', text: 'Alcune pagine non sono state riconosciute. Puoi salvarle e riprovare dopo.', ok: 'Salva' });
      if (r) { await DB.put('sources', doc); nav.replace('source', { id: doc.id, tab: 'pages' }); }
    }
  });
  cleanups.push(() => items.forEach(it => { if (it.url) URL.revokeObjectURL(it.url); try { it.pdf && it.pdf.destroy(); } catch (e) { } }));

}

  const theme = h('select', { class: 'inp' }, [['', 'Automatico'], ['light', 'Chiaro'], ['dark', 'Scuro']].map(([v, l]) => h('option', { value: v, selected: LS.get('theme', '') === v }, l)));
  theme.addEventListener('change', () => { LS.set('theme', theme.value); applyPrefs(); });
  const size = h('select', { class: 'inp' }, [[15, 'Piccolo'], [17, 'Normale'], [19, 'Grande'], [21, 'Molto grande']].map(([v, l]) => h('option', { value: v, selected: LS.get('fs', 17) === v }, l)));
  size.addEventListener('change', () => { LS.set('fs', +size.value); applyPrefs(); });
  const lang = h('select', { class: 'inp' }, h('option', { value: 'it-IT' }, 'Italiano'), h('option', { value: 'en-US', selected: LS.get('lang', 'it-IT') === 'en-US' }, 'Inglese'));
  lang.addEventListener('change', () => LS.set('lang', lang.value));
  const keepAudio = h('input', { type: 'checkbox', checked: LS.get('keepAudio', true) });
  keepAudio.addEventListener('change', () => LS.set('keepAudio', keepAudio.checked));
  let usage = '';
  try { const e = await navigator.storage.estimate(); usage = `Spazio usato: ${(e.usage / 1048576).toFixed(1)} MB`; } catch (e) { }
  m.append(
    h('label', { class: 'f' }, 'Tema', theme), h('label', { class: 'f' }, 'Dimensione del testo', size), h('label', { class: 'f' }, 'Lingua predefinita delle lezioni', lang),
    h('h2', null, 'Server AI'),
    (() => {
      const u = h('input', { class: 'inp', type: 'url', placeholder: 'https://lezione-ai.tuonome.workers.dev', value: LS.get('apiUrl', '') || DEFAULT_API_URL });
      const pw = h('input', { class: 'inp', type: 'password', placeholder: 'Password impostata sul Worker', value: LS.get('apiPw', '') });
      const st = h('p', { class: 'small muted' }, apiUrl() ? 'Server configurato.' : 'Server non configurato: le funzioni AI sono disattivate.');
      return h('div', null, h('label', { class: 'f' }, 'Indirizzo del Worker', u), h('label', { class: 'f' }, 'Password', pw), st,
        h('div', { class: 'row' },
          h('button', { class: 'btn sm', onclick: () => { LS.set('apiUrl', u.value.trim()); LS.set('apiPw', pw.value); st.textContent = u.value.trim() ? 'Salvato.' : 'Server non configurato.'; } }, 'Salva'),
          h('button', { class: 'btn plain sm', onclick: async () => {
            LS.set('apiUrl', u.value.trim()); LS.set('apiPw', pw.value);
            const r = await withBusy('Provo la connessione…', signal => ai('Rispondi solo con la parola: ok', { signal, maxTokens: 10 }));
            if (r) st.textContent = 'Connessione riuscita.';
          } }, 'Prova connessione')));
    })(),
    h('h2', null, 'Corsi'), h('button', { class: 'btn plain', onclick: () => nav.root('courses') }, icon('book'), 'Gestisci corsi'),
    h('h2', null, 'Privacy e dati'),
    h('p', null, "Registrazioni, documenti, appunti e quiz sono salvati solo in questo browser. Quando generi appunti o materiali, il testo (e le immagini da leggere) passa dal tuo server e viene inviato tramite OpenRouter al modello che hai scelto. Con i modelli gratuiti (:free) i contenuti possono essere usati dai fornitori per addestrare i loro modelli: non inserire dati personali o sensibili. L'audio non viene mai inviato."),
    h('p', { class: 'small muted' }, usage),
    h('div', { class: 'row' },
      h('button', { class: 'btn plain', onclick: exportAll }, icon('download'), 'Esporta tutti i dati'),
      h('button', { class: 'btn plain', onclick: deleteAudio }, 'Elimina tutti gli audio'),
      h('button', { class: 'btn danger', onclick: async () => { if (await ask({ title: 'Cancellare tutto?', text: 'Corsi, lezioni, audio, documenti, materiali e flashcard verranno eliminati da questo dispositivo.', ok: 'Cancella tutto', danger: true })) { await DB.clear(); LS.set('draft', null); toast('Dati cancellati.'); nav.root('home'); } } }, icon('trash'), 'Cancella tutto')),
    h('h2', null, 'Informazioni'),
    h('p', { class: 'small muted' }, 'Lezione, versione web installabile. La trascrizione dal vivo usa il riconoscimento vocale del browser; per registrare tieni la pagina aperta e lo schermo acceso.'),
    h('button', { class: 'btn ghost sm', onclick: () => { LS.set('onboarded', false); nav.root('onboarding'); } }, 'Rivedi la presentazione'));
};
async function exportAll() {
  const data = { exportedAt: new Date().toISOString(), courses: await DB.all('courses'), sources: await DB.all('sources'), materials: await DB.all('materials'), cards: await DB.all('cards') };
  download('lezione-backup.json', JSON.stringify(data, null, 2));
}
async function deleteAudio() {
  if (!await ask({ title: 'Eliminare gli audio?', text: 'Trascrizioni e appunti restano. Non potrai più riascoltare le lezioni.', ok: 'Elimina audio', danger: true })) return;
  for (const s of await DB.all('sources')) if (s.audioId) { await DB.del('blobs', s.audioId); s.audioId = null; await DB.put('sources', s); }
  toast('Audio eliminati.');
}
function applyPrefs() {
  const t = LS.get('theme', '');
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  document.documentElement.style.setProperty('--fs', LS.get('fs', 17) + 'px');
}

/* ============ Avvio ============ */
window.addEventListener('beforeunload', e => { if (recordingActive) { e.preventDefault(); e.returnValue = ''; } });
applyPrefs();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
nav.root(LS.get('onboarded', false) ? 'home' : 'onboarding');
</script>
</body>
</html>
